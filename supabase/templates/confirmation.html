<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background:#f3f5f0;font-family:Inter,Arial,sans-serif;color:#19261f">
    <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #dce2d5;border-radius:14px">
      <tr><td style="padding:28px">
        <p style="margin:0 0 4px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#5c685f">Peak Clipping Agency</p>
        <h1 style="margin:0 0 16px;font-size:22px">Confirmez votre adresse e-mail</h1>
        <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/fr/app" style="display:inline-block;background:#19261f;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:6px">Confirmer mon adresse</a></p>
        <hr style="border:0;border-top:1px solid #dce2d5;margin:0 0 24px">
        <h2 style="margin:0 0 16px;font-size:18px">Confirm your email address</h2>
        <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/en/app" style="color:#2e4436;font-weight:600">Confirm my address</a></p>
        <p style="margin:0;font-size:12px;color:#5c685f">Si vous n’êtes pas à l’origine de cette demande, ignorez ce message. · If you did not request this, ignore this email.</p>
      </td></tr>
    </table>
  </body>
</html>
