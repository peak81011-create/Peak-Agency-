<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SiteHeader — en-tête du site public</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./peak.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pk-c" style="font-family: Inter, system-ui, sans-serif; color: #EBEFE6">
  <header class="site-head">
    <div class="wrap site-head-in">
      <a class="logo" href="Home.dc.html" aria-label="Peak Clipping Agency — accueil" style="color: #B6C2AA">
        <svg viewBox="0 0 268 594" width="17" height="38" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M0 0H143L268 126L143 250H89V554L45 594L0 554ZM89 75H134L184 126L134 175H89Z"/></svg>
        <span class="logo-word" style="color: #EBEFE6">Clipping Agency</span>
      </a>
      <nav class="site-nav" aria-label="Navigation du site">
        <a href="Home.dc.html#how" class="{{c.how}}">Comment ça marche</a>
        <a href="Pricing.dc.html" class="{{c.pricing}}">Offres</a>
        <a href="Home.dc.html#faq" class="{{c.faq}}">FAQ</a>
        <a href="Contact.dc.html" class="{{c.contact}}">Contact</a>
      </nav>
      <div class="row g-3" style="flex-wrap: nowrap">
        <div class="seg seg-dark lang" role="group" aria-label="Langue"><button class="on" aria-pressed="true">FR</button><button aria-pressed="false">EN</button></div>
        <a class="btn btn-on-dark site-cta" href="Auth.dc.html" style="border: 0">Se connecter</a>
        <a class="btn btn-sage site-cta" href="Pricing.dc.html">Démarrer</a>
        <button class="btn btn-icon btn-on-dark site-burger" aria-label="Ouvrir le menu" style="border: 0"><span class="ic ic-menu"></span></button>
      </div>
    </div>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","how","pricing","faq","contact"],"default":"home"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const c = {};
    ['how', 'pricing', 'faq', 'contact'].forEach((k) => { c[k] = k === a ? 'on' : ''; });
    return { c };
  }
}
</script>
</body>
</html>
