<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Assistante — mes tâches</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./peak.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pk" style="font-family: Inter, system-ui, sans-serif; color: #19261F; background: #F3F5F0">
  <div class="app">
    <div class="app-side"><dc-import name="AppNav" role="assistante" active="tasks" hint-size="100%,800px"></dc-import></div>
    <div class="app-main">
      <dc-import name="AppTopbar" section="Assistante" crumb="Mes tâches" initials="CR" hint-size="100%,69px"></dc-import>
      <div class="page-head"><div class="stack g-1"><span class="sm subtle">Mardi 20 octobre</span><h1 class="h1">Bonjour Camille</h1></div><a class="btn btn-primary" href="AdminTasks.dc.html"><span class="ic ic-sm ic-plus"></span>Tâche</a></div>
      <div class="page-body">
        <div class="grid-3">
          <a class="card stat" href="AdminPayments.dc.html" style="text-decoration: none; color: #19261F; background: #19261F; border-color: #19261F"><span class="stat-label" style="color: #CBD4C1"><span class="ic ic-sm ic-bank"></span>Paiements à vérifier</span><span class="stat-value" style="color: #FFFFFF">3</span><span class="sm" style="color: #B6C2AA">Vérifier →</span></a>
          <a class="card stat" href="AdminInbox.dc.html" style="text-decoration: none; color: #19261F"><span class="stat-label"><span class="ic ic-sm ic-inbox"></span>Demandes sans réponse</span><span class="stat-value">2</span><span class="sm subtle">La plus ancienne : hier 21:14</span></a>
          <div class="card stat"><span class="stat-label"><span class="ic ic-sm ic-checklist"></span>Faites cette semaine</span><span class="stat-value">14</span><div class="bar"><span style="width: 64%"></span></div></div>
        </div>
        <div class="split" style="grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start">
          <div class="stack g-5">
            <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
              <section class="card card-pad-0" style="border-color: {{g.bc}}">
                <div class="row between" style="padding: 14px 18px; border-bottom: 1px solid #EBEFE6; background: {{g.hbg}}"><h2 class="h3 row g-2"><span class="ic ic-sm {{g.icon}}"></span>{{g.t}}</h2><span class="badge {{g.tone}}">{{g.n}}</span></div>
                <sc-for list="{{g.items}}" as="t" hint-placeholder-count="3">
                  <div class="row g-3" style="padding: 14px 18px; border-bottom: 1px solid #EBEFE6; flex-wrap: nowrap; align-items: flex-start">
                    <input type="checkbox" aria-label="Terminer : {{t.t}}" style="width: 22px; height: 22px; accent-color: #19261F; margin-top: 1px; flex: none">
                    <div class="stack grow" style="gap: 4px; min-width: 0"><span class="strong">{{t.t}}</span><div class="row g-3 xs subtle"><span>{{t.client}}</span><span class="prio prio-{{t.p}}"><i></i>{{t.pl}}</span><span class="row g-1"><span class="ic ic-sm ic-checklist"></span>{{t.cl}}</span></div></div>
                    <span class="sm strong" style="color: {{t.dc}}; white-space: nowrap">{{t.due}}</span>
                  </div>
                </sc-for>
              </section>
            </sc-for>
          </div>
          <section class="card" aria-labelledby="up">
            <div class="card-head"><h2 id="up" class="h3">À venir</h2><a class="sm" href="AdminTasks.dc.html">Calendrier</a></div>
            <div class="stack" style="gap: 0">
              <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="5">
                <div class="row g-3" style="padding: 10px 0; border-bottom: 1px solid #EBEFE6; flex-wrap: nowrap"><div class="stack" style="width: 48px; flex: none; text-align: center; gap: 0; padding: 4px 0; border-radius: 8px; background: #F4F6F1"><span class="xs subtle">{{u.dow}}</span><span class="h3 num">{{u.d}}</span></div><div class="stack grow" style="gap: 2px; min-width: 0"><span class="sm strong trunc">{{u.t}}</span><span class="xs subtle">{{u.client}}</span></div></div>
              </sc-for>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const T = (t, client, p, cl, due, late) => ({ t, client, p, pl: { haute: 'Haute', normale: 'Normale', basse: 'Basse' }[p], cl, due, dc: late ? '#94271C' : '#435047' });
    return {
      groups: [
        { t: 'En retard', icon: 'ic-alert', tone: 'st-retard', n: '2', bc: '#E4B4AD', hbg: '#FDF6F5', items: [T('Relancer Hugo Vasseur pour le virement', 'Hugo Vasseur', 'haute', '0/2', 'Hier', true), T('Créer le compte TikTok de Nora K.', 'Nora K.', 'haute', '1/3', '17/10', true)] },
        { t: 'Aujourd’hui', icon: 'ic-clock', tone: 't-blue', n: '4', bc: '#DCE2D5', hbg: '#FFFFFF', items: [T('Vérifier les 3 virements du jour', '—', 'haute', '0/3', '12:00', false), T('Répondre à Studio Bastien (accroches)', 'Studio Bastien', 'normale', '0/1', '14:00', false), T('Envoyer le planning de la semaine à Léa', 'Léa Martin', 'normale', '0/1', '17:00', false), T('Mettre à jour les bios Instagram', 'Maxime Roux', 'basse', '1/2', '18:00', false)] }
      ],
      upcoming: [
        { dow: 'Mer', d: '21', t: 'Préparer les factures de fin de mois', client: 'Tous clients' },
        { dow: 'Jeu', d: '22', t: 'Créer le compte Instagram de Nora K.', client: 'Nora K.' },
        { dow: 'Jeu', d: '22', t: 'Point hebdo avec Alexandre', client: '—' },
        { dow: 'Ven', d: '23', t: 'Relance Chloé P. (abonnement expiré)', client: 'Chloé P.' },
        { dow: 'Lun', d: '26', t: 'Onboarding de @kevin.irl si signé', client: 'Prospect' }
      ]
    };
  }
}
</script>
</body>
</html>
