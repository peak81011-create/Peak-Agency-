<x-dc>
<helmet>

  <div class="phone"><span class="phone-cap">Mes demandes</span><div class="phone-frame"><dc-import name="ClientRequests" hint-size="390px,1900px"></dc-import></div></div>
  <div class="phone"><span class="phone-cap">Abonnement &amp; factures</span><div class="phone-frame"><dc-import name="ClientBilling" hint-size="390px,1900px"></dc-import></div></div>
</div>
</x-dc>
